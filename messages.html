<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MOKUTA Messages</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #15263d;
    }
    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: 100vh;
      max-width: 1400px;
      margin: 0 auto;
    }
    .sidebar {
      background: #0b1f3a;
      color: white;
      padding: 20px;
      overflow-y: auto;
    }
    .main {
      background: white;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .topbar {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 18px 20px;
      font-weight: 700;
      color: #0b1f3a;
    }
    .conversation-item {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      color: white;
      border-radius: 10px;
      margin-top: 12px;
      text-align: left;
      padding: 12px;
      cursor: pointer;
    }
    .conversation-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 13px;
      margin-bottom: 6px;
    }
    .conversation-preview {
      color: #dfeaf6;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .messages-panel {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f8fafc;
    }
    .message-row {
      display: flex;
      margin-bottom: 14px;
    }
    .message-row.mine {
      justify-content: flex-end;
    }
    .message-bubble {
      max-width: 70%;
      padding: 12px 14px;
      border-radius: 12px;
      background: #e7b84b;
      color: #0b1f3a;
      font-size: 14px;
      line-height: 1.5;
    }
    .message-row.theirs .message-bubble {
      background: #e5e7eb;
      color: #15263d;
    }
    .composer {
      border-top: 1px solid #e5e7eb;
      padding: 16px;
      display: flex;
      gap: 12px;
      background: white;
    }
    input {
      flex: 1;
      border: 1px solid #dfe5ed;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
    }
    .button {
      background: #e7b84b;
      color: #0b1f3a;
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
    }
    @media (max-width: 760px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .sidebar {
        height: auto;
      }
      .main {
        min-height: 60vh;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h2>MOKUTA</h2>
      <p style="color:#dfeaf6;">Messages</p>
      <div id="conversationList"></div>
    </aside>

    <main class="main">
      <div class="topbar" id="conversationHeader">Select a conversation</div>
      <div id="messagesPanel" class="messages-panel"></div>
      <div class="composer">
        <input id="messageInput" type="text" placeholder="Type your message...">
        <button id="sendMessageBtn" class="button">Send</button>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://jgdvbsmyhrpnaqtbneug.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_VYW_Y-d8BItFm9A2QZ2Jwg_BHGN2Yos';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let user = null;

    async function getSessionUser() {
      const { data: { session }, error } = await db.auth.getSession();
      if (error || !session) {
        window.location.href = 'index.html';
        return null;
      }
      return session.user;
    }

    async function loadUserConversations() {
      const listEl = document.getElementById('conversationList');

      const { data, error } = await db
        .from('conversations')
        .select('*')
        .or(`buyer_id.eq.${user.id},seller_id.eq.${user.id}`)
        .order('last_message_at', { ascending: false });

      if (error) {
        console.error(error);
        return;
      }

      if (!data || !data.length) {
        listEl.innerHTML = '<div style="color:#dfeaf6;padding-top:18px;">No conversations yet</div>';
        return;
      }

      listEl.innerHTML = '';

      for (const conversation of data) {
        const otherUserId = conversation.buyer_id === user.id ? conversation.seller_id : conversation.buyer_id;

        const { data: sellerData } = await db
          .from('profiles')
          .select('*')
          .eq('id', otherUserId)
          .maybeSingle();

        const { data: lastMessage } = await db
          .from('messages')
          .select('*')
          .eq('conversation_id', conversation.id)
          .order('created_at', { ascending: false })
          .limit(1)
          .maybeSingle();

        const item = document.createElement('button');
        item.className = 'conversation-item';
        item.type = 'button';
        item.innerHTML = `
          <div class="conversation-head">
            <strong>${sellerData?.full_name || 'Seller'}</strong>
            <small>${new Date(conversation.last_message_at || conversation.created_at).toLocaleString()}</small>
          </div>
          <div class="conversation-preview">${lastMessage?.content || 'No messages yet'}</div>
        `;

        item.onclick = () => openConversation(conversation.id, otherUserId);
        listEl.appendChild(item);
      }
    }

    async function openConversation(conversationId, otherUserId) {
      const messagesEl = document.getElementById('messagesPanel');
      const headerEl = document.getElementById('conversationHeader');

      const { data: otherProfile } = await db
        .from('profiles')
        .select('*')
        .eq('id', otherUserId)
        .maybeSingle();

      headerEl.textContent = otherProfile?.full_name || 'Seller';

      const { data: items, error } = await db
        .from('messages')
        .select('*')
        .eq('conversation_id', conversationId)
        .order('created_at', { ascending: true });

      if (error) {
        console.error(error);
        return;
      }

      messagesEl.innerHTML = (items || []).map((msg) => {
        const isMe = msg.sender_id === user.id;
        return `
          <div class="message-row ${isMe ? 'mine' : 'theirs'}">
            <div class="message-bubble">${msg.content}</div>
          </div>
        `;
      }).join('');

      const sendBtn = document.getElementById('sendMessageBtn');
      const messageInput = document.getElementById('messageInput');

      sendBtn.onclick = async () => {
        const content = messageInput.value.trim();
        if (!content) return;

        const { error } = await db.from('messages').insert({
          conversation_id: conversationId,
          sender_id: user.id,
          receiver_id: otherUserId,
          listing_id: null,
          content,
          read_status: false
        });

        if (error) {
          console.error(error);
          return;
        }

        messageInput.value = '';
        await openConversation(conversationId, otherUserId);
        await loadUserConversations();
      };

      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function init() {
      user = await getSessionUser();
      if (!user) return;

      await loadUserConversations();

      const params = new URLSearchParams(window.location.search);
      const conversationId = params.get('conversation');
      const sellerId = params.get('seller');

      if (conversationId && sellerId) {
        openConversation(conversationId, sellerId);
      }
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
