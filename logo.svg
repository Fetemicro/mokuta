<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">MOKUTA logo</title>
  <desc id="desc">Blue MOKUTA app icon with a white center mark containing a bold blue M, without the original bag handle.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1499f5"/>
      <stop offset="0.45" stop-color="#0870ec"/>
      <stop offset="1" stop-color="#092bb5"/>
    </linearGradient>
  </defs>

  <!-- Blue rounded-square app background -->
  <rect width="512" height="512" rx="84" fill="url(#blue)"/>

  <!-- White central mark, closely matching the original but with the handle removed -->
  <path fill="#fff" d="M137 126h238c24 0 43 17 48 41l29 145c6 31-17 59-49 59H109c-32 0-55-28-49-59l29-145c5-24 24-41 48-41Z"/>

  <!-- Bold blue M inside the white center mark -->
  <path fill="url(#blue)" d="M126 315V169h42l45 62 45-62h42v146h-37v-87l-34 49h-32l-34-49v87z"/>

  <!-- White MOKUTA wordmark -->
  <text x="256" y="438" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="66" font-weight="800" letter-spacing="2">MOKUTA</text>
</svg>
